[package]
name = "pool_fetcher"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
dotenv = "0.15"
anyhow = "1.0"
indicatif = "0.17"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }